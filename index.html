<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>Китайский с нуля</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&display=swap">
<style>
:root{
  --bg:#faf7f2;--card:#ffffff;--fg:#1f1d1a;--mut:#6b655c;--line:#e6dfd3;
  --acc:#b3261e;--acc2:#fbe9e7;--ok:#2e7d32;--bad:#c62828;
  --t1:#d32f2f;--t2:#2e7d32;--t3:#1565c0;--t4:#7b1fa2;--t5:#8a8a8a;
  --hz:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16140f;--card:#211e18;--fg:#efe9df;--mut:#a59d90;--line:#37322a;
  --acc:#ef7b6f;--acc2:#3a201c;--ok:#81c784;--bad:#ef9a9a;
  --t1:#ff6b6b;--t2:#6fcf73;--t3:#64a8ff;--t4:#c58af0;--t5:#9a9a9a;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#16140f;--card:#211e18;--fg:#efe9df;--mut:#a59d90;--line:#37322a;
  --acc:#ef7b6f;--acc2:#3a201c;--ok:#81c784;--bad:#ef9a9a;
  --t1:#ff6b6b;--t2:#6fcf73;--t3:#64a8ff;--t4:#c58af0;--t5:#9a9a9a;color-scheme:dark;}
.big.hz,.mid.hz,.tile .hz{font-family:"Noto Serif SC",var(--hz);font-weight:600}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 16px calc(76px + env(safe-area-inset-bottom,0px));}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding:8px 0;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}
header h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.ib{background:none;border:1px solid var(--line);border-radius:10px;font-size:20px;padding:6px 10px;color:var(--fg);cursor:pointer}
main{max-width:760px;margin:0 auto}
section{padding-top:12px}
h2{font-size:20px;margin:8px 0 10px}
h3{font-size:16px;margin:18px 0 8px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:3px}
.btn:active{transform:scale(.97)}
.primary{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:600;width:100%;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hz{font-family:var(--hz)}
.big{font-size:64px;line-height:1.2;text-align:center}
.mid{font-size:34px}
.ru.big{font-size:28px}
.py{color:var(--mut);font-size:18px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px 10px;font-size:12px}
nav button b{display:block;font-size:20px;font-family:var(--hz);font-weight:400}
nav button.on{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.tile .hz{font-size:36px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 8px;font-size:18px}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.rate button{border:0;border-radius:10px;padding:12px 2px;color:#fff;font-weight:600;font-size:14px}
.r0{background:#c62828}.r1{background:#ef6c00}.r2{background:#2e7d32}.r3{background:#1565c0}
.badge{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.center{text-align:center}
.huge{font-size:56px;border-radius:50%;width:120px;height:120px;border:2px solid var(--acc);background:var(--acc2)}
.res{margin-top:8px;font-size:15px;min-height:1em}
.phr{cursor:pointer}
.hideru .phr .ru{filter:blur(6px)}
.hideru .phr.open .ru{filter:none}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;font-size:15px}
.tw{overflow-x:auto}
.dict-row{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dict-row .hz{font-size:24px;min-width:70px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.l{background:#ef6c00}.dot.k{background:var(--ok)}
input[type=search],input[type=text],select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.hw{display:inline-block;border:1px solid var(--line);border-radius:8px;margin:4px;background:var(--card)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;max-width:90vw;z-index:20;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
#ovl .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.warn{background:color-mix(in srgb,#ef6c00 15%,var(--card));border:1px solid #ef6c00;border-radius:12px;padding:10px 12px;font-size:14px}
.ch{cursor:pointer;border-radius:4px}
.ch:hover{background:var(--acc2)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:26px}
svg.curve{width:120px;height:64px}
</style>
</head>
<body>
<header>
  <h1>中文 Китайский с нуля<small id="ver"></small></h1>
  <button class="ib" onclick="show('stats')" title="Прогресс">📊</button>
  <button class="ib" onclick="openSettings()" title="Настройки">⚙</button>
</header>

<main>
<section id="t-home"></section>
<section id="t-sounds" hidden></section>
<section id="t-words" hidden></section>
<section id="t-phrases" hidden></section>
<section id="t-read" hidden></section>
<section id="t-stats" hidden></section>
</main>

<nav>
  <button data-t="home" onclick="show('home')"><b>家</b>Старт</button>
  <button data-t="sounds" onclick="show('sounds')"><b>声</b>Звуки</button>
  <button data-t="words" onclick="show('words')"><b>词</b>Слова</button>
  <button data-t="phrases" onclick="show('phrases')"><b>说</b>Фразы</button>
  <button data-t="read" onclick="show('read')"><b>字</b>Чтение</button>
</nav>
<div id="toast"></div>
<div id="ovl" hidden onclick="if(event.target===this)closeOvl()"><div class="sheet" id="sheet"></div></div>

const $ = s => document.querySelector(s);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function toast(m, ms){ const t=$('#toast'); t.innerHTML=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms||2200); }
function toneOf(syl){
  if(/[āēīōūǖĀĒĪŌŪ]/.test(syl)) return 1; if(/[áéíóúǘÁÉÍÓÚ]/.test(syl)) return 2;
  if(/[ǎěǐǒǔǚǍĚǏǑǓ]/.test(syl)) return 3; if(/[àèìòùǜÀÈÌÒÙ]/.test(syl)) return 4; return 5;
}
function pyJoin(py){ return py.split(' ').map((x,i)=> i>0 && /^[aoeāáǎàōóǒòēéěè]/i.test(x) ? "'"+x : x).join(''); }
function colorHz(hz, py){
  const ch=[...hz], sy=py.split(' ');
  if(ch.length!==sy.length) return hz;
  return ch.map((c,i)=>'<span class="t'+toneOf(sy[i])+'">'+c+'</span>').join('');
}
function colorPy(py){ return py.split(' ').map((s,i)=>'<span class="t'+toneOf(s)+'">'+(i>0&&/^[aoeāáǎàōóǒòēéěè]/i.test(s)?"'":'')+s+'</span>').join(''); }

let zhVoice = null, voicesReady = false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices(); if(vs.length) voicesReady = true;
  zhVoice = vs.find(v=>v.name===S.settings.voice) || vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang) || /^cmn/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = () => { pickVoice(); if(S.tab==='home') renderHome(); }; }
function say(text, rate){
  if(!('speechSynthesis' in window)){ toast('Этот браузер не умеет озвучивать текст'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; if(zhVoice) u.voice = zhVoice;
  u.rate = rate || S.settings.rate;
  speechSynthesis.speak(u);
}
function slow(text){ say(text, 0.5); }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const EMBED = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
function onlyHz(s){ return (s.match(/[㐀-鿿]/g)||[]).join(''); }
function lcs(a,b){ const A=[...a],B=[...b]; const d=Array(B.length+1).fill(0);
  for(let i=1;i<=A.length;i++){ let prev=0; for(let j=1;j<=B.length;j++){ const t=d[j]; d[j]=A[i-1]===B[j-1]?prev+1:Math.max(d[j],d[j-1]); prev=t; } } return d[B.length]; }
function listen(target, outId){
  const out = document.getElementById(outId);
  if(EMBED){ out.innerHTML = '🎤 В веб-версии по ссылке микрофон закрыт. Тренируйтесь так: 🔊 послушайте → повторите вслух 3 раза → снова 🔊 и сравните.'; return; }
  if(!SR){ out.innerHTML = '🎤 Распознавание речи недоступно: нужен Chrome/Edge, интернет и открытие через localhost или https. Пока тренируйтесь так: послушайте → повторите вслух → сравните.'; return; }
  const r = new SR(); r.lang='zh-CN'; r.interimResults=false; r.maxAlternatives=5;
  out.textContent = '🎤 Говорите…';
  r.onresult = e => {
    const tgt = onlyHz(target); let best=-1, heard='';
    for(const alt of e.results[0]){ const sc = lcs(tgt, onlyHz(alt.transcript)) / Math.max(1,tgt.length); if(sc>best){best=sc;heard=alt.transcript;} }
    const pct = Math.round(best*100);
    out.innerHTML = 'Услышано: <span class="hz">'+heard+'</span> — '+(pct>=90?'<b style="color:var(--ok)">отлично! '+pct+'%</b>':pct>=50?'<b style="color:#ef6c00">почти: '+pct+'%</b>':'<b style="color:var(--bad)">ещё раз: '+pct+'%</b>');
  };
  r.onerror = e => { out.textContent = 'Микрофон: ' + (e.error==='not-allowed'?'нет доступа (разрешите микрофон)':e.error==='no-speech'?'ничего не услышал':e.error); };
  try{ r.start(); }catch(e){ out.textContent='Не удалось включить микрофон'; }
}

let Q = [], cur = null, QZ = null;
function buildQueue(){
  const now=Date.now();
  const due = shuffle(WORDS.filter(w => S.srs[w[0]] && S.srs[w[0]].d <= now));
  const newLeft = Math.max(0, S.settings.newPerDay - dayRec().nw);
  const fresh = WORDS.filter(w => !S.srs[w[0]]).slice(0, newLeft);
  Q = due.concat(fresh);
}
function moreNew(){ const extra = WORDS.filter(w => !S.srs[w[0]] && !Q.includes(w)).slice(0,5); if(!extra.length){toast('Все слова уже в изучении 🎉');return;} Q = Q.concat(extra); renderCard(); }
function wordsEnter(){

    <button class="btn ${m==='recall'?'badge':''}" onclick="setMode('recall')">смысл → 字</button></div>
   <div class="mut" id="winfo"></div>

    <div class="mut">● серый — новое, ● оранжевый — изучается, ● зелёный — выучено</div><div id="dict"></div></details>`;
  if(QZ) renderQuiz(); else { if(!Q.length) buildQueue(); renderCard(); }

}
function setMode(m){ S.settings.mode=m; save(); wordsEnter(); }
function winfo(){ const c=counts(); const el=$('#winfo'); if(el) el.textContent = 'В очереди: '+Q.length+' · к повторению: '+c.due+' · новых сегодня: '+dayRec().nw+'/'+S.settings.newPerDay+' · выучено: '+c.known; }
function wordBack(w, id){
  return `<div class="hz big" onclick="say('${w[0]}')" style="cursor:pointer">${colorHz(w[0],w[1])}</div>
   <div class="center py">${colorPy(w[1])}</div><div class="center" style="font-size:20px;margin-top:4px">${w[2]}</div>

    <button class="btn" onclick="strokes('${w[0]}','${id}w')">✍ черты</button><button class="btn" onclick="strokes('${w[0]}','${id}w',true)">✏ написать</button>

   <div id="${id}w" class="center"></div><div id="${id}m" class="res center"></div>`;
}
function renderCard(){

  if(!Q.length){
    box.innerHTML = `<div class="center"><div style="font-size:48px">🎉</div><b>На сегодня всё!</b>

     <button class="primary" onclick="moreNew()">Ещё 5 новых слов</button></div>`; return;
  }
  cur = Q[0];
  const isNew = !S.srs[cur[0]], m = S.settings.mode;
  if(isNew){
    box.innerHTML = `<span class="badge">новое слово</span>${wordBack(cur,'c')}
     <div class="mut center" style="margin-top:6px">Послушайте 2–3 раза и повторите вслух. Через пару карточек оно вернётся для проверки.</div>

  }

    : `<div class="ru big center">${cur[2]}</div><div class="mut center">Вспомните иероглиф и произношение</div>`;
  box.innerHTML = `<div id="front">${front}</div><button class="primary" id="showBtn" onclick="reveal()">Показать ответ</button>`;

function introduce(){
  S.srs[cur[0]] = {i:0, e:2.5, d:Date.now(), r:0, l:0};
  dayRec().nw++; save();
  Q.shift(); Q.splice(Math.min(3,Q.length), 0, cur);
  renderCard();
}
function reveal(){
  $('#card').innerHTML = wordBack(cur,'c') + `<div class="mut center" style="margin-top:8px">Насколько хорошо вспомнили?</div>
   <div class="rate"><button class="r0" onclick="rate(0)">Не помню</button><button class="r1" onclick="rate(1)">Трудно</button>
   <button class="r2" onclick="rate(2)">Помню</button><button class="r3" onclick="rate(3)">Легко</button></div>`;
  if(S.settings.autoplay && S.settings.mode!=='listen') say(cur[0]);
}
function grade(hz, g){
  const now = Date.now(); const s = S.srs[hz] || {i:0,e:2.5,d:now,r:0,l:0};
  if(g===0){ s.r=0; s.l++; s.i=0; s.e=Math.max(1.3,s.e-0.2); s.d=now; }
  else{
    if(g===1){ s.i = s.r===0 ? 0.5 : Math.max(1, s.i*1.2); s.e=Math.max(1.3,s.e-0.15); }
    else if(g===2){ s.i = s.r===0 ? 1 : s.r===1 ? 3 : Math.round(s.i*s.e); }
    else { s.i = s.r===0 ? 3 : Math.round(s.i*s.e*1.3)+1; s.e+=0.15; }
    s.r++; s.d = now + s.i*DAY;
  }
  S.srs[hz] = s;
}
function rate(g){
  grade(cur[0], g); dayRec().rev++; save();
  Q.shift(); if(g===0) Q.splice(Math.min(3,Q.length), 0, cur);
  renderCard();
}
function renderDict(f){
  const el = $('#dict'); if(!el) return; f = (f||'').trim().toLowerCase();
  const plain = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ /g,'');
  el.innerHTML = WORDS.filter(w => !f || w[0].includes(f) || plain(w[1]).toLowerCase().includes(plain(f)) || w[2].toLowerCase().includes(f))
    .map(w => { const s=S.srs[w[0]]; const cls = !s ? '' : (s.r>=1&&s.i>=3?'k':'l');
      return `<div class="dict-row" onclick="say('${w[0]}')"><span class="dot ${cls}"></span><span class="hz">${colorHz(w[0],w[1])}</span><span class="py" style="min-width:90px">${colorPy(w[1])}</span><span>${w[2]}</span></div>`; }).join('');
}

function startQuiz(){
  const pool = WORDS.filter(w => S.srs[w[0]]);
  if(pool.length < 4){ toast('Сначала познакомьтесь хотя бы с 4 словами в карточках'); return; }
  const qs = shuffle(pool).slice(0,10).map(w => {
    const others = shuffle(WORDS.filter(x => x!==w && x[2]!==w[2] && x[1]!==w[1])).slice(0,3);
    return {w, type: pick(['read','listen','recall']), opts: shuffle([w].concat(others))};
  });
  QZ = {qs, i:0, ok:0, done:false}; renderQuiz();
}
function renderQuiz(){
  const box=$('#card'); if(!box) return;
  if(QZ.i >= QZ.qs.length){
    const n=QZ.qs.length; box.innerHTML = `<div class="center"><div style="font-size:48px">${QZ.ok>=n*.8?'🏆':QZ.ok>=n*.5?'👍':'💪'}</div>
     <b>Результат: ${QZ.ok} из ${n}</b><div class="mut">Ошибки отправлены на повторение.</div>
     <button class="primary" onclick="QZ=null;wordsEnter()">К карточкам</button><button class="btn" onclick="startQuiz()" style="width:100%">Ещё тест</button></div>`;
    return;
  }
  const q = QZ.qs[QZ.i]; QZ.done=false;
  const head = q.type==='read' ? `<div class="hz big">${q.w[0]}</div><div class="mut center">Что значит?</div>`
    : q.type==='listen' ? `<div class="center"><button class="huge" onclick="say(QZ.qs[QZ.i].w[0])">🔊</button><div class="mut">Что услышали?</div></div>`
    : `<div class="ru big center">${q.w[2]}</div><div class="mut center">Выберите иероглиф</div>`;
  const lab = o => q.type==='recall' ? `<span class="hz" style="font-size:28px">${o[0]}</span>` : o[2];
  box.innerHTML = `<div class="mut">Вопрос ${QZ.i+1} из ${QZ.qs.length} · верно: ${QZ.ok}</div>${head}
   <div class="opts" id="qzo">${q.opts.map((o,k)=>`<button onclick="qzAns(${k})">${lab(o)}</button>`).join('')}</div><div id="qzr" class="res"></div>`;
  if(q.type==='listen') setTimeout(()=>say(q.w[0]),250);
}
function qzAns(k){
  if(QZ.done) return; QZ.done=true;
  const q=QZ.qs[QZ.i], right=q.opts.indexOf(q.w), ok=k===right, r=dayRec();
  r.q++; if(ok){ r.qok++; QZ.ok++; } else { const s=S.srs[q.w[0]]; if(s){ s.l++; s.d=Date.now(); } }
  save();
  const bs=document.querySelectorAll('#qzo button'); bs[right].classList.add('ok'); if(!ok) bs[k].classList.add('bad');
  say(q.w[0]);
  $('#qzr').innerHTML = `<div class="center"><span class="hz mid">${colorHz(q.w[0],q.w[1])}</span> ${colorPy(q.w[1])} — ${q.w[2]}</div>
   <button class="primary" onclick="QZ.i++;renderQuiz()">Дальше →</button>`;
}

   <button class="btn" onclick="say('你好，我是你的汉语老师。')">🔊 Проверить голос</button>
   <label style="display:block;margin-top:12px">Новых слов в день</label>
   <select onchange="S.settings.newPerDay=+this.value;save();Q=[]">${[5,10,15,20,30].map(n=>`<option ${n===S.settings.newPerDay?'selected':''}>${n}</option>`).join('')}</select>
   <label style="display:block;margin-top:12px">Голос</label>
   <select onchange="S.settings.voice=this.value;save();pickVoice()"><option value="">авто</option>${vs.map(v=>`<option ${v.name===S.settings.voice?'selected':''} value="${v.name}">${v.name} (${v.lang})</option>`).join('')}</select>
   ${vs.length?'':'<div class="warn" style="margin-top:6px">Китайских голосов не найдено — см. подсказку на вкладке «Старт».</div>'}
   <label class="row" style="margin-top:12px"><input type="checkbox" ${S.settings.autoplay?'checked':''} onchange="S.settings.autoplay=this.checked;save()"> Автоматически озвучивать карточки</label>
   <div class="mut" style="margin-top:12px">Версия ${APP.ver} от ${APP.date}. Распознавание речи: ${SR?'есть':'нет в этом браузере'}.</div>
   <button class="primary" onclick="closeOvl()">Готово</button>`;
  $('#ovl').hidden = false;
}
function closeOvl(){ $('#ovl').hidden = true; if(S.tab==='words') wordsEnter(); }

/* ================= ЗАПУСК ================= */
load();
$('#ver').textContent = 'v'+APP.ver+' · '+APP.date;
show(['home','sounds','words','phrases','read','stats'].includes(S.tab) ? S.tab : 'home');
</script>
</body>
</html>
